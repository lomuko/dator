<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Editor de CV</title>
<link rel="stylesheet" href="{{ '/assets/css/cv.css' | relative_url }}">
<style>
body { margin: 0; background: #f1efea; }
.eb { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e4dccd; }
.eb button, .eb select, .eb label.btn { font: inherit; font-size: .85rem; padding: 6px 12px; border: 1px solid #c9b998; border-radius: 6px; background: #fff; color: #1b1b1b; cursor: pointer; }
.eb .main { background: #8a5200; border-color: #8a5200; color: #fff; }
.eb .sp { flex: 1; }
.eb #status { font-size: .8rem; color: #555; }
.eb input[type=file] { display: none; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, label.btn:focus-within { outline: 2px solid #8a5200; outline-offset: 2px; }
.layout { display: grid; grid-template-columns: minmax(340px, 460px) 1fr; gap: 20px; padding: 16px; align-items: start; }
.form { background: #fff; border: 1px solid #e4dccd; border-radius: 8px; padding: 14px; max-height: calc(100vh - 90px); overflow: auto; }
.preview { min-width: 0; }
fieldset.grp { border: 1px solid #e4dccd; border-radius: 8px; margin: 0 0 14px; padding: 10px 12px 12px; }
fieldset.grp > legend { font-weight: 700; color: #8a5200; padding: 0 6px; }
.f { display: block; margin: 8px 0; font-size: .82rem; color: #555; }
.f input, .f textarea { display: block; width: 100%; margin-top: 3px; padding: 6px 8px; font: inherit; font-size: .9rem; color: #1b1b1b; background: #fff; border: 1px solid #cfc7b6; border-radius: 5px; }
.f textarea { resize: vertical; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.itm { margin: 10px 0; padding: 8px 10px 10px; background: #fbf6ec; border-left: 3px solid #a86400; border-radius: 0 6px 6px 0; }
.bar { display: flex; align-items: center; gap: 4px; }
.bar strong { flex: 1; font-size: .8rem; color: #555; }
.bar button, .add { font: inherit; font-size: .8rem; padding: 3px 9px; border: 1px solid #c9b998; border-radius: 5px; background: #fff; cursor: pointer; }
.add { margin-top: 4px; color: #6b3f00; }
.note { margin: 0 0 12px; font-size: .8rem; color: #555; }
@media (max-width: 900px) { .layout { grid-template-columns: 1fr; } .form { max-height: none; } }
@media print { .layout { display: block; padding: 0; } .form, .eb { display: none !important; } }
</style>
</head>
<body class="cv-page">
<div class="eb cv-noprint">
  <select id="lang" aria-label="Idioma del CV"><option value="es">Español</option><option value="en">English</option></select>
  <button type="button" id="b-pub" title="Descarta el borrador y carga el CV publicado">Cargar publicado</button>
  <label class="btn">Importar JSON<input type="file" id="b-imp" accept="application/json,.json"></label>
  <button type="button" id="b-exp">Descargar JSON</button>
  <span class="sp"></span>
  <span id="status" role="status"></span>
  <a href="{{ '/cv/' | relative_url }}" style="font-size:.85rem;color:#6b3f00">Ver /cv/</a>
  <button type="button" class="main" id="b-print">Imprimir / PDF</button>
</div>
<div class="layout" id="cvb" data-base="{{ '/assets/cv/' | relative_url }}">
  <div class="form cv-noprint" id="form"></div>
  <div class="preview" id="cv-out"></div>
</div>
<script src="{{ '/assets/js/cv-render.js' | relative_url }}"></script>
<script>
(function () {
  var root = document.getElementById('cvb'), base = root.getAttribute('data-base');
  var formEl = document.getElementById('form'), out = document.getElementById('cv-out'), statusEl = document.getElementById('status');
  var lang = 'es', data = CV.blank('es'), saveTimer = null;

  var BLANK = {
    experience: function () { return { role: '', company: '', start: '', end: '', bullets: [''], stack: '' }; },
    skills: function () { return { name: '', items: [] }; },
    projects: function () { return { name: '', url: '', text: '' }; },
    education: function () { return { title: '', school: '', period: '' }; },
    languages: function () { return { name: '', level: '' }; }
  };

  function ls(fn) { try { return fn(window.localStorage); } catch (e) { return null; } }
  function say(t) { statusEl.textContent = t; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function getp(path) { return path.split('.').reduce(function (o, k) { return o == null ? o : o[k]; }, data); }
  function setp(path, v) { var ks = path.split('.'), o = data; for (var i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = v; }

  /* ---------- controles ---------- */
  function lab(text, ctrl) { var l = el('label', 'f'); l.appendChild(el('span', null, text)); l.appendChild(ctrl); return l; }
  function inp(path, ph) { var i = el('input'); i.type = 'text'; i.value = getp(path) || ''; i.setAttribute('data-path', path); i.setAttribute('data-kind', 'str'); if (ph) i.placeholder = ph; return i; }
  function area(path, rows, kind) {
    var t = el('textarea'), v = getp(path);
    t.rows = rows || 3; t.value = kind === 'lines' ? (v || []).join('\n') : (v || '');
    t.setAttribute('data-path', path); t.setAttribute('data-kind', kind || 'str'); return t;
  }
  function group(title) { var f = el('fieldset', 'grp'); f.appendChild(el('legend', null, title)); return f; }
  function btn(text, act, path, i, title) {
    var b = el('button', null, text); b.type = 'button'; b.setAttribute('data-act', act); b.setAttribute('data-arr', path);
    if (i != null) b.setAttribute('data-i', String(i)); if (title) { b.title = title; b.setAttribute('aria-label', title); } return b;
  }
  function listGroup(title, arr, addText, build) {
    var g = group(title), items = data[arr] || [];
    items.forEach(function (it, i) {
      var box = el('div', 'itm'), bar = el('div', 'bar');
      bar.appendChild(el('strong', null, '#' + (i + 1)));
      bar.appendChild(btn('↑', 'up', arr, i, 'Subir'));
      bar.appendChild(btn('↓', 'down', arr, i, 'Bajar'));
      bar.appendChild(btn('✕', 'del', arr, i, 'Eliminar'));
      box.appendChild(bar); build(box, arr + '.' + i); g.appendChild(box);
    });
    var add = btn('+ ' + addText, 'add', arr); add.className = 'add'; g.appendChild(add);
    return g;
  }

  function buildForm() {
    formEl.textContent = '';
    formEl.appendChild(el('p', 'note', 'Edita aquí y mira el resultado a la derecha. Se guarda un borrador en este navegador. Para publicarlo: «Descargar JSON», guárdalo en assets/cv/cv-' + lang + '.json y haz commit.'));

    var g = group('Datos personales');
    g.appendChild(lab('Nombre', inp('name')));
    g.appendChild(lab('Titular', inp('title')));
    var cols = el('div', 'cols');
    [['email', 'Email'], ['phone', 'Teléfono'], ['location', 'Ubicación'], ['web', 'Web'], ['linkedin', 'LinkedIn'], ['github', 'GitHub']].forEach(function (c) { cols.appendChild(lab(c[1], inp('contact.' + c[0]))); });
    g.appendChild(cols);
    formEl.appendChild(g);

    g = group('Perfil'); g.appendChild(lab('Resumen', area('summary', 5))); formEl.appendChild(g);

    formEl.appendChild(listGroup('Experiencia', 'experience', 'Añadir trabajo', function (box, p) {
      var c = el('div', 'cols');
      c.appendChild(lab('Puesto', inp(p + '.role'))); c.appendChild(lab('Empresa', inp(p + '.company')));
      c.appendChild(lab('Inicio', inp(p + '.start', 'Ene 2020'))); c.appendChild(lab('Fin (vacío = actualidad)', inp(p + '.end')));
      box.appendChild(c);
      box.appendChild(lab('Logros (uno por línea)', area(p + '.bullets', 4, 'lines')));
      box.appendChild(lab('Tecnologías', inp(p + '.stack')));
    }));

    formEl.appendChild(listGroup('Competencias', 'skills', 'Añadir grupo', function (box, p) {
      box.appendChild(lab('Grupo', inp(p + '.name')));
      var items = area(p + '.items', 2, 'csv'); items.value = (getp(p + '.items') || []).join(', ');
      box.appendChild(lab('Elementos (separados por comas)', items));
    }));

    formEl.appendChild(listGroup('Proyectos', 'projects', 'Añadir proyecto', function (box, p) {
      box.appendChild(lab('Nombre', inp(p + '.name'))); box.appendChild(lab('Enlace', inp(p + '.url')));
      box.appendChild(lab('Descripción', area(p + '.text', 3)));
    }));

    formEl.appendChild(listGroup('Formación', 'education', 'Añadir estudio', function (box, p) {
      box.appendChild(lab('Título', inp(p + '.title'))); box.appendChild(lab('Centro', inp(p + '.school'))); box.appendChild(lab('Periodo', inp(p + '.period')));
    }));

    g = group('Certificaciones'); g.appendChild(lab('Una por línea', area('certifications', 4, 'lines'))); formEl.appendChild(g);

    formEl.appendChild(listGroup('Idiomas', 'languages', 'Añadir idioma', function (box, p) {
      var c = el('div', 'cols'); c.appendChild(lab('Idioma', inp(p + '.name'))); c.appendChild(lab('Nivel', inp(p + '.level'))); box.appendChild(c);
    }));
  }

  function preview() { CV.render(data, lang, out); document.title = (data.name || 'CV') + ' - CV'; }
  function scheduleSave() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function () {
      var ok = ls(function (s) { s.setItem('cv-builder-v1-' + lang, JSON.stringify(data)); return true; });
      say(ok ? 'Borrador guardado en este navegador' : 'No se puede guardar el borrador (almacenamiento bloqueado)');
    }, 400);
  }

  /* ---------- eventos del formulario ---------- */
  formEl.addEventListener('input', function (e) {
    var t = e.target, p = t.getAttribute('data-path'); if (!p) return;
    var k = t.getAttribute('data-kind'), v = t.value;
    if (k === 'lines') v = v.split('\n'); else if (k === 'csv') v = v.split(',');
    setp(p, v); preview(); scheduleSave();
  });
  formEl.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-act]'); if (!b) return;
    var arr = b.getAttribute('data-arr'), act = b.getAttribute('data-act'), i = parseInt(b.getAttribute('data-i'), 10), a = data[arr];
    if (act === 'add') a.push(BLANK[arr]());
    else if (act === 'del') a.splice(i, 1);
    else if (act === 'up' && i > 0) { var x = a[i]; a[i] = a[i - 1]; a[i - 1] = x; }
    else if (act === 'down' && i < a.length - 1) { var y = a[i]; a[i] = a[i + 1]; a[i + 1] = y; }
    buildForm(); preview(); scheduleSave();
  });

  /* ---------- carga / guardado ---------- */
  function fetchPublished(l) {
    return fetch(base + 'cv-' + l + '.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (j) { return CV.normalize(j, l); });
  }
  function open(l, forcePublished) {
    lang = l; document.documentElement.lang = l; document.getElementById('lang').value = l;
    ls(function (s) { s.setItem('cv-builder-lang', l); });
    var draft = forcePublished ? null : ls(function (s) { return s.getItem('cv-builder-v1-' + l); });
    var done = function (d, msg) { data = d; buildForm(); preview(); say(msg); };
    if (draft) { try { return done(CV.normalize(JSON.parse(draft), l), 'Borrador recuperado de este navegador'); } catch (e) { /* borrador corrupto: seguimos */ } }
    fetchPublished(l).then(function (d) {
      if (forcePublished) ls(function (s) { s.removeItem('cv-builder-v1-' + l); });
      done(d, 'Cargado el CV publicado');
    }).catch(function () { done(CV.blank(l), 'No hay CV publicado: empiezas en blanco'); });
  }

  document.getElementById('lang').addEventListener('change', function (e) { open(e.target.value, false); });
  document.getElementById('b-pub').addEventListener('click', function () {
    if (window.confirm('Se descartará tu borrador de este idioma y se cargará el CV publicado. ¿Continuar?')) open(lang, true);
  });
  document.getElementById('b-exp').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(CV.tidy(data), null, 2) + '\n'], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'cv-' + lang + '.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    say('Descargado cv-' + lang + '.json');
  });
  document.getElementById('b-imp').addEventListener('change', function (e) {
    var f = e.target.files && e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try { var j = JSON.parse(r.result); if (!j || typeof j !== 'object' || Array.isArray(j)) throw 0; data = CV.normalize(j, lang); buildForm(); preview(); scheduleSave(); say('Importado ' + f.name); }
      catch (err) { clearTimeout(saveTimer); say('El archivo no es un JSON de CV válido'); }
    };
    r.readAsText(f); e.target.value = '';
  });
  document.getElementById('b-print').addEventListener('click', function () { window.print(); });

  open(ls(function (s) { return s.getItem('cv-builder-lang'); }) === 'en' ? 'en' : 'es', false);
})();
</script>
</body>
</html>

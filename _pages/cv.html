<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>David Tortajada - CV</title>
<link rel="stylesheet" href="{{ '/assets/css/cv.css' | relative_url }}">
<style>
body { margin: 0; background: #f1efea; }
.cv-bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px 16px; background: #fff; border-bottom: 1px solid #e4dccd; }
.cv-bar .sp { flex: 1; }
.cv-bar a, .cv-bar button { font: inherit; font-size: .88rem; padding: 6px 14px; border: 1px solid #c9b998; border-radius: 6px; background: #fff; color: #1b1b1b; cursor: pointer; text-decoration: none; }
.cv-bar button[aria-pressed="true"] { border-color: #8a5200; font-weight: 700; background: #fbf6ec; }
.cv-bar .main { background: #8a5200; border-color: #8a5200; color: #fff; }
.cv-bar button:focus-visible, .cv-bar a:focus-visible { outline: 2px solid #8a5200; outline-offset: 2px; }
.cv-wrap { padding: 20px 12px 40px; }
.cv-hint { max-width: 820px; margin: 0 auto 12px; color: #555; font-size: .85rem; }
.cv-msg { text-align: center; color: #555; padding: 40px 0; }
</style>
</head>
<body class="cv-page">
<div class="cv-bar cv-noprint">
  <button type="button" id="l-es" aria-pressed="true">Español</button>
  <button type="button" id="l-en" aria-pressed="false">English</button>
  <span class="sp"></span>
  <a href="{{ '/' | relative_url }}">← davidtor.es</a>
  <button type="button" class="main" id="pdf">Descargar PDF</button>
</div>
<div class="cv-wrap">
  <p class="cv-hint cv-noprint" id="hint">En el diálogo de impresión elige «Guardar como PDF» y desactiva «Encabezados y pies de página».</p>
  <div id="cv-out" data-base="{{ '/assets/cv/' | relative_url }}"><p class="cv-msg">…</p></div>
</div>
<script src="{{ '/assets/js/cv-render.js' | relative_url }}"></script>
<script>
(function () {
  var out = document.getElementById('cv-out'), base = out.getAttribute('data-base');
  var lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'es';
  var cache = {}, data = null;
  var HINT = { es: 'En el diálogo de impresión elige «Guardar como PDF» y desactiva «Encabezados y pies de página».', en: 'In the print dialog choose “Save as PDF” and turn off “Headers and footers”.' };
  var BTN = { es: 'Descargar PDF', en: 'Download PDF' };
  function show() {
    document.documentElement.lang = lang;
    document.getElementById('l-es').setAttribute('aria-pressed', String(lang === 'es'));
    document.getElementById('l-en').setAttribute('aria-pressed', String(lang === 'en'));
    document.getElementById('pdf').textContent = BTN[lang];
    document.getElementById('hint').textContent = HINT[lang];
    var go = function (d) { data = d; CV.render(d, lang, out); document.title = (d.name || 'CV') + ' - CV'; };
    if (cache[lang]) return go(cache[lang]);
    fetch(base + 'cv-' + lang + '.json', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (j) { cache[lang] = CV.normalize(j, lang); go(cache[lang]); })
      .catch(function () { out.textContent = ''; var p = document.createElement('p'); p.className = 'cv-msg'; p.textContent = lang === 'en' ? 'Could not load the CV.' : 'No se ha podido cargar el CV.'; out.appendChild(p); });
  }
  function setLang(l) { lang = l; try { history.replaceState(null, '', l === 'en' ? '?lang=en' : location.pathname); } catch (e) {} show(); }
  document.getElementById('l-es').addEventListener('click', function () { setLang('es'); });
  document.getElementById('l-en').addEventListener('click', function () { setLang('en'); });
  document.getElementById('pdf').addEventListener('click', function () { window.print(); });
  show();
})();
</script>
</body>
</html>
